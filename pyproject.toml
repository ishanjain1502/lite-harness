[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lite-ness"
version = "0.1.0"
description = "Lightweight agent harness — turn/step loop, tools, session log"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
openai = ["httpx>=0.27"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
liteness = "liteness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/liteness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
