<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>lite-ness Analytics</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1419;
      --panel: #1a2332;
      --text: #e7ecf3;
      --muted: #9aa7b8;
      --accent: #5b9cff;
      --border: #2a3648;
      --good: #3ecf8e;
      --warn: #f5a623;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      justify-content: space-between;
    }
    h1 { margin: 0; font-size: 1.25rem; font-weight: 600; }
    .controls { display: flex; gap: 0.75rem; align-items: center; }
    select, button {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.4rem 0.75rem;
      font: inherit;
    }
    button { cursor: pointer; }
    button:hover { border-color: var(--accent); }
    main { padding: 1.5rem; max-width: 1200px; margin: 0 auto; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
    }
    .card h2 {
      margin: 0 0 0.25rem;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      font-weight: 500;
    }
    .card .value { font-size: 1.5rem; font-weight: 600; }
    section { margin-bottom: 1.5rem; }
    section h3 { margin: 0 0 0.75rem; font-size: 1rem; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    th, td {
      text-align: left;
      padding: 0.65rem 0.85rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }
    th { color: var(--muted); font-weight: 500; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(91, 156, 255, 0.06); }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .bar-row { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.5rem; }
    .bar-label { width: 120px; font-size: 0.85rem; color: var(--muted); }
    .bar-track {
      flex: 1;
      height: 8px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
    }
    .bar-fill { height: 100%; background: var(--accent); border-radius: 999px; }
    .bar-value { width: 80px; text-align: right; font-size: 0.85rem; }
    .detail-panel { display: none; }
    .detail-panel.active { display: block; }
    .muted { color: var(--muted); font-size: 0.85rem; }
    .error { color: #ff6b6b; }
    .source-badge {
      display: inline-block;
      padding: 0.1rem 0.45rem;
      border-radius: 999px;
      font-size: 0.75rem;
      background: rgba(91, 156, 255, 0.15);
      color: var(--accent);
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>lite-ness Analytics</h1>
      <p class="muted">Historical harness usage across ClickHouse and local JSONL sessions</p>
    </div>
    <div class="controls">
      <label>
        Range
        <select id="since">
          <option value="24h">Last 24 hours</option>
          <option value="7d" selected>Last 7 days</option>
          <option value="30d">Last 30 days</option>
          <option value="all">All time</option>
        </select>
      </label>
      <button id="refresh" type="button">Refresh</button>
    </div>
  </header>

  <main>
    <div id="error" class="error" hidden></div>

    <div class="grid" id="overview"></div>

    <section>
      <h3>Token usage over time</h3>
      <div id="timeseries" class="card"></div>
    </section>

    <section>
      <h3>Sessions</h3>
      <table>
        <thead>
          <tr>
            <th>Session</th>
            <th>Source</th>
            <th>Turns</th>
            <th>Tokens</th>
            <th>Cost</th>
            <th>Last seen</th>
          </tr>
        </thead>
        <tbody id="sessions"></tbody>
      </table>
    </section>

    <section class="detail-panel" id="detail-panel">
      <h3>Session detail <span id="detail-id" class="muted"></span></h3>
      <div class="grid" id="detail-metrics"></div>
      <table>
        <thead>
          <tr>
            <th>Turn</th>
            <th>Tokens</th>
            <th>Cost</th>
            <th>Stop reason</th>
            <th>Time</th>
          </tr>
        </thead>
        <tbody id="detail-turns"></tbody>
      </table>
    </section>

    <section>
      <h3>Stop reasons</h3>
      <div id="stop-reasons" class="card"></div>
    </section>

    <section>
      <h3>Tool error rates</h3>
      <table>
        <thead>
          <tr>
            <th>Tool</th>
            <th>Calls</th>
            <th>Failures</th>
            <th>Error rate</th>
          </tr>
        </thead>
        <tbody id="tools"></tbody>
      </table>
    </section>
  </main>

  <script>
    const fmt = {
      num: (n) => Number(n || 0).toLocaleString(),
      money: (n) => "$" + Number(n || 0).toFixed(4),
      pct: (n) => (Number(n || 0) * 100).toFixed(1) + "%",
      time: (iso) => iso ? new Date(iso).toLocaleString() : "—",
    };

    async function api(path) {
      const since = document.getElementById("since").value;
      const res = await fetch(path + "?since=" + encodeURIComponent(since));
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.error || res.statusText);
      }
      return res.json();
    }

    function card(title, value) {
      return `<div class="card"><h2>${title}</h2><div class="value">${value}</div></div>`;
    }

    function renderBars(container, rows, valueKey, labelKey) {
      if (!rows.length) {
        container.innerHTML = "<p class='muted'>No data in this range.</p>";
        return;
      }
      const max = Math.max(...rows.map((r) => Number(r[valueKey] || 0)), 1);
      container.innerHTML = rows.map((row) => {
        const value = Number(row[valueKey] || 0);
        const width = Math.max(2, (value / max) * 100);
        return `<div class="bar-row">
          <div class="bar-label">${row[labelKey]}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${width}%"></div></div>
          <div class="bar-value">${fmt.num(value)}</div>
        </div>`;
      }).join("");
    }

    async function loadOverview() {
      const data = await api("/api/overview");
      document.getElementById("overview").innerHTML = [
        card("Sessions", fmt.num(data.session_count)),
        card("Queries (turns)", fmt.num(data.turn_count)),
        card("Total tokens", fmt.num(data.total_tokens)),
        card("Input tokens", fmt.num(data.input_tokens)),
        card("Output tokens", fmt.num(data.output_tokens)),
        card("Total cost", fmt.money(data.total_cost_usd)),
        card("Avg tokens / query", fmt.num(Math.round(data.avg_tokens_per_turn || 0))),
        card("LLM requests", fmt.num(data.llm_requests)),
      ].join("");
    }

    async function loadTimeseries() {
      const data = await api("/api/tokens/timeseries");
      renderBars(document.getElementById("timeseries"), data.buckets || [], "total_tokens", "bucket");
    }

    async function loadSessions() {
      const data = await api("/api/sessions");
      const tbody = document.getElementById("sessions");
      tbody.innerHTML = (data.sessions || []).map((s) => `<tr>
        <td><a href="#" data-session="${s.session_id}">${s.session_id}</a></td>
        <td><span class="source-badge">${s.source}</span></td>
        <td>${fmt.num(s.turn_count)}</td>
        <td>${fmt.num(s.total_tokens)}</td>
        <td>${fmt.money(s.total_cost_usd)}</td>
        <td>${fmt.time(s.last_seen)}</td>
      </tr>`).join("") || "<tr><td colspan='6' class='muted'>No sessions found.</td></tr>";
      tbody.querySelectorAll("a[data-session]").forEach((link) => {
        link.addEventListener("click", (event) => {
          event.preventDefault();
          loadSessionDetail(link.dataset.session);
        });
      });
    }

    async function loadSessionDetail(sessionId) {
      const res = await fetch("/api/sessions/" + encodeURIComponent(sessionId));
      if (!res.ok) return;
      const data = await res.json();
      document.getElementById("detail-panel").classList.add("active");
      document.getElementById("detail-id").textContent = sessionId;
      const summary = data.summary || {};
      const metrics = data.metrics || {};
      document.getElementById("detail-metrics").innerHTML = [
        card("Turns", fmt.num(summary.turn_count)),
        card("Tokens", fmt.num(summary.total_tokens)),
        card("Cost", fmt.money(summary.total_cost_usd)),
        card("Tool calls", fmt.num(metrics.tool_calls || 0)),
      ].join("");
      document.getElementById("detail-turns").innerHTML = (data.turns || []).map((t) => `<tr>
        <td>${t.turn}</td>
        <td>${fmt.num(t.tokens)}</td>
        <td>${fmt.money(t.cost_usd)}</td>
        <td>${t.stop_reason || "—"}</td>
        <td>${fmt.time(t.timestamp)}</td>
      </tr>`).join("") || "<tr><td colspan='5' class='muted'>No turns recorded.</td></tr>";
    }

    async function loadStopReasons() {
      const data = await api("/api/stop-reasons");
      renderBars(document.getElementById("stop-reasons"), data.stop_reasons || [], "count", "stop_reason");
    }

    async function loadTools() {
      const data = await api("/api/tools/error-rates");
      const tbody = document.getElementById("tools");
      tbody.innerHTML = (data.tools || []).map((t) => `<tr>
        <td>${t.tool_name}</td>
        <td>${fmt.num(t.calls)}</td>
        <td>${fmt.num(t.failures)}</td>
        <td>${fmt.pct(t.error_rate)}</td>
      </tr>`).join("") || "<tr><td colspan='4' class='muted'>No tool calls in this range.</td></tr>";
    }

    async function refresh() {
      const errorEl = document.getElementById("error");
      errorEl.hidden = true;
      try {
        await Promise.all([
          loadOverview(),
          loadTimeseries(),
          loadSessions(),
          loadStopReasons(),
          loadTools(),
        ]);
      } catch (err) {
        errorEl.textContent = String(err.message || err);
        errorEl.hidden = false;
      }
    }

    document.getElementById("refresh").addEventListener("click", refresh);
    document.getElementById("since").addEventListener("change", refresh);
    refresh();
  </script>
</body>
</html>
